name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check femsolver/ tests/

      - name: Mypy (non bloquant au départ — voir plan CI, étape 4)
        run: mypy femsolver/ || true

      - name: Tests
        run: pytest tests/ --cov=femsolver --cov-report=term-missing
