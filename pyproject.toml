[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-solver"
version = "0.1.0"
description = "Solveur éléments finis pour la mécanique des solides (statique & dynamique)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "clu23"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "meshio>=5.3",
]

[project.optional-dependencies]
viz3d = ["pyvista>=0.42"]
perf = ["python-mumps", "numba"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
]
all = ["fem-solver[viz3d,perf,dev]"]

[tool.setuptools.packages.find]
include = ["femsolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 99
target-version = "py311"
# Périmètre du lint = bibliothèque + tests. Les scripts de démonstration
# (examples/, benchmarks/) sont volontairement hors périmètre.
extend-exclude = ["examples", "benchmarks"]

[tool.ruff.lint]
# Baseline sûre : pyflakes (F) + pycodestyle (E/W) + isort (I).
# Étendre plus tard vers UP, B, SIM une fois le vert stable.
select = ["E", "F", "W", "I"]
# Règles stylistiques/domaine volontairement tolérées :
#   E702 : point-virgule d'alignement des entrées de matrices (K_e, M_e)
#   E741 : noms mono-lettre standards en mécanique (I = inertie, l = longueur)
#   E731 : affectation de lambda (usage local assumé, ex. intégrateurs)
ignore = ["E702", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]    # ré-exports volontaires
"tests/*" = ["E501", "F841"]  # lignes longues + variables intermédiaires dans les tests

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
